# ============================================
# Ganesh Utsav Expense Tracker - Backend Config
# ============================================

# Render injects PORT at runtime; falls back to 8090 for local dev
server.port=${PORT:8090}
spring.application.name=ganesh-utsav-backend

# ---------- MySQL Database ----------
# Reads from env vars in production (set these on Render to your Aiven MySQL details).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ganesh_utsav_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- File upload (bill/invoice) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/bills

# ---------- JWT ----------
# Reads from JWT_SECRET env var in production (set this on Render).
app.jwt.secret=${JWT_SECRET:b0HpDSVjj/YKFaxeF5GCZ/h3B9yn+/qj6xEcRh0W53Q2Ge4OpcH+zMnCMUNWABX82DzJU9wWz0BUCKz1+gD+Xg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Reads from CORS_ALLOWED_ORIGINS env var in production (set this on Render to your Vercel URL).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ganeshustav.vercel.app}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.ganeshutsav.backend=DEBUG