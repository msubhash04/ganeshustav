# ============================================
# Ganesh Utsav Expense Tracker - Backend Config
# ============================================

# Render injects PORT at runtime; falls back to 8090 for local dev
server.port=${PORT:8090}
spring.application.name=ganesh-utsav-backend

# ---------- MySQL Database ----------
# Reads from env vars in production (set these on Render to your Aiven MySQL details).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ganesh_utsav_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- File upload (bill/invoice) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/bills

# ---------- JWT ----------
# Reads from the JWT_SECRET env var - REQUIRED in production (set this on
# Render). No real secret is committed here: if JWT_SECRET is unset,
# JwtUtil generates a random one at startup for local dev only (see its
# warning log) so everyone is forced to set their own secret before
# deploying anywhere real, instead of accidentally reusing a value that's
# sitting in source control.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Tenant Inspection ("View as President") tokens are deliberately much
# shorter-lived than a normal login session - 30 min by default - so an
# elevated Developer context never lingers longer than necessary.
app.jwt.inspection-expiration-ms=${JWT_INSPECTION_EXPIRATION_MS:1800000}

# ---------- CORS ----------
# Reads from CORS_ALLOWED_ORIGINS env var in production (set this on Render to your Vercel URL).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ganeshustav.vercel.app}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.ganeshutsav.backend=DEBUG