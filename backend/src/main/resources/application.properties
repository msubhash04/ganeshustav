# ============================================
# Ganesh Utsav Expense Tracker - Backend Config
# ============================================

server.port=8090
spring.application.name=ganesh-utsav-backend

# ---------- MySQL Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/ganesh_utsav_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- File upload (bill/invoice) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/bills

# ---------- JWT ----------
# IMPORTANT: change this secret before deploying to production (min 256-bit / 32+ chars)
app.jwt.secret=ChangeThisSuperSecretKeyForGaneshUtsavExpenseTracker2026!!
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.ganeshutsav.backend=DEBUG
